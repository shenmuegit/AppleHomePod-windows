<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" role="img" aria-labelledby="title description">
  <title id="title">Windows audio to HomePod</title>
  <desc id="description">Windows apps play through a HomePod output controlled by Windows volume and mute. The audio is sent to a HomePod on the local network.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7" fill="none" stroke="#8a94a3" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .label { fill: #1d1d1f; font-size: 19px; font-weight: 600; }
      .detail { fill: #626266; font-size: 13px; }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="178" rx="20" fill="#f6f7f9" stroke="#e3e5e9"/>
  <g transform="translate(71 38)">
    <rect x="0" y="0" width="42" height="30" rx="4" fill="#fff" stroke="#8a94a3" stroke-width="2"/>
    <path d="M21 30v7M10 38h22" fill="none" stroke="#8a94a3" stroke-width="2" stroke-linecap="round"/>
    <rect x="7" y="7" width="11" height="6" rx="1" fill="#2563eb"/>
    <rect x="22" y="7" width="13" height="6" rx="1" fill="#dce7fc"/>
    <rect x="7" y="17" width="28" height="5" rx="1" fill="#e8ebf0"/>
  </g>
  <text x="71" y="109" class="label">Windows apps</text>
  <text x="71" y="134" class="detail">Music, video, system audio</text>
  <path d="M281 88h54" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g transform="translate(387 38)">
    <path d="M0 13h9l12-9v31L9 26H0Z" fill="#2563eb"/>
    <path d="M28 12q11 8 0 16M34 5q20 15 0 30" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="387" y="109" class="label">HomePod output</text>
  <text x="387" y="134" class="detail">Windows volume and mute</text>
  <path d="M599 88h54" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g transform="translate(705 34)">
    <path d="M3 19C3 5 42 5 42 19v11C42 45 3 45 3 30Z" fill="#e4e7ec" stroke="#8a94a3" stroke-width="1.5"/>
    <ellipse cx="22.5" cy="18" rx="17" ry="7" fill="#fff" stroke="#b2b9c3"/>
    <ellipse cx="22.5" cy="17" rx="6" ry="2" fill="#dce7fc"/>
    <path d="M10 29h25M12 34h21" stroke="#c3c9d2" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <text x="705" y="109" class="label">HomePod</text>
  <text x="705" y="134" class="detail">On your local network</text>
</svg>
